
spring.application.name=backend

server.address=0.0.0.0
server.port=${PORT:10000}

spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/campus_pulse}
spring.datasource.username=${DB_USER:campus}
